<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartDeck — A evolução do estudo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --sd-blue: #1d4ed8;
        --sd-blue-dark: #1e3a8a;
        --sd-bg: #f6f7fb;
      }
      * { font-family: 'Inter', system-ui, sans-serif; }
      body { background: var(--sd-bg); }
      .card-flip { perspective: 1200px; }
      .card-inner { transition: transform .55s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; }
      .card-inner.flipped { transform: rotateY(180deg); }
      .card-face { backface-visibility: hidden; }
      .card-back { transform: rotateY(180deg); }
      .logo-cards { position: relative; width: 28px; height: 28px; }
      .logo-cards span { position: absolute; inset: 0; border-radius: 6px; background: white; border: 2px solid var(--sd-blue); }
      .logo-cards span:nth-child(1) { transform: translate(-4px,-4px) rotate(-8deg); opacity: .55; }
      .logo-cards span:nth-child(2) { transform: translate(0,0) rotate(0deg); }
      .logo-cards span:nth-child(3) { transform: translate(4px,4px) rotate(8deg); background: var(--sd-blue); border-color: var(--sd-blue-dark); }
      .fade-in { animation: fade .35s ease both; }
      @keyframes fade { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
      .pulse-dot { animation: pulse 1.2s infinite; }
      @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
    </style>
  </head>
  <body class="text-slate-800">
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
          <div class="logo-cards"><span></span><span></span><span></span></div>
          <div class="leading-tight">
            <div class="font-extrabold text-lg tracking-tight">SmartDeck</div>
            <div class="text-[10px] uppercase tracking-widest text-slate-400">A evolução do estudo</div>
          </div>
        </div>
        <nav class="flex items-center gap-1 text-sm">
          <button onclick="goHome()" class="px-3 py-1.5 rounded-md hover:bg-slate-100">Início</button>
          <button onclick="renderDeckList()" class="px-3 py-1.5 rounded-md hover:bg-slate-100">Meus decks</button>
          <span class="text-xs text-slate-400 ml-3 hidden md:inline">PUC-Campinas · Práticas Empreendedoras</span>
        </nav>
      </div>
    </header>

    <main id="app" class="max-w-6xl mx-auto px-6 py-10"></main>

    <footer class="text-center text-xs text-slate-400 py-10">
      SmartDeck — demo · Gabriel Borges · Fernando Munhoz Molinari · Gabriel Dimas
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
